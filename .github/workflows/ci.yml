name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'integration/**', 'frontend/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q backend db scripts
      - name: Run unit tests
        run: python scripts/run_tests.py --suite unit --report test_reports/unit-ci.json
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-report
          path: test_reports/unit-ci.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend API contract
        working-directory: frontend
        run: npm run test:contract
      - name: TypeScript static validation
        working-directory: frontend
        run: npx tsc --noEmit
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-only-temporary-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose]
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-temporary-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local Compose configuration
        run: printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env
      - name: Start three services and wait for healthchecks
        run: docker compose up --detach --build --wait
      - name: Verify HTTP contract through Nginx
        run: python scripts/check_runtime.py --url http://127.0.0.1:8080 --contract
      - name: Run backend and PostgreSQL integration tests
        run: python scripts/test_backend.py
      - name: Show service status if tests fail
        if: failure()
        run: docker compose ps
      - name: Stop services
        if: always()
        run: docker compose down
