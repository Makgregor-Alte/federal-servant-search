limit_req_zone $binary_remote_addr zone=servant_queries:10m rate=5r/s;
log_format safe_access '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 4k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log safe_access;
    limit_req_status 429;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    error_page 429 = @rate_limit;
    error_page 502 = @upstream_unavailable;
    error_page 504 = @upstream_timeout;
    error_page 413 = @request_too_large;

    location @rate_limit {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 429 '{"error":"rate_limited","message":"Limite de requisicoes excedido"}';
    }

    location @upstream_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 503 '{"error":"service_unavailable","message":"Servico temporariamente indisponivel"}';
    }

    location @upstream_timeout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 504 '{"error":"timeout","message":"Tempo limite de resposta excedido"}';
    }

    location @request_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 413 '{"error":"http_error","message":"Requisicao muito grande"}';
    }

    location = /api/servidores {
        limit_req zone=servant_queries burst=10 nodelay;
        proxy_pass http://backend:5000;
    }

    location = /api/servants {
        limit_req zone=servant_queries burst=10 nodelay;
        proxy_pass http://backend:5000;
    }

    location /api/ {
        proxy_pass http://backend:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
